
name: Family Quest Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        
      
      - name: Setup Godot Android environment
        run: |
          mkdir -p "$HOME/.config/godot"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cat >> "$HOME/.config/godot/editor_settings-4.3.tres" <<'EOF'
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/adb = "/usr/bin/adb"
          export/android/jarsigner = "/usr/bin/jarsigner"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"



      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FamilyQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyQuest-Android-APK
          path: build/FamilyQuest.apk
          if-no-files-found: error
