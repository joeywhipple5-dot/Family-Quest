
name: Family Quest Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        
      
      
      - name: Setup Godot Android environment
        run: |
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          test -f /root/debug.keystore
          test -d /usr/lib/android-sdk
          test -d /usr/lib/jvm/java-17-openjdk-amd64




      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FamilyQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyQuest-Android-APK
          path: build/FamilyQuest.apk
          if-no-files-found: error
