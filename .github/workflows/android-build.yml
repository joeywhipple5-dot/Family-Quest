
name: Family Quest Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        
      
      

      - name: Setup Godot Android environment
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          cp /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          grep -q 'export/android/java_sdk_path' "$SETTINGS" || echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          grep -q 'export/android/android_sdk_path' "$SETTINGS" || echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore =' "$SETTINGS" || echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore_user' "$SETTINGS" || echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          grep -q 'export/android/debug_keystore_pass' "$SETTINGS" || echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"

      - name: Diagnose Android build tools
        run: |
          echo "=== HOME ==="
          echo "$HOME"
          echo "=== Godot settings ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=== Java ==="
          ls -ld /usr/lib/jvm/java-17-openjdk-amd64 || true
          echo "=== Android SDK ==="
          ls -ld /usr/lib/android-sdk /usr/lib/android-sdk/build-tools/33.0.2 || true
          echo "=== Debug keystore ==="
          ls -l /root/debug.keystore || true
          echo "=== Export templates ==="
          ls -l "$HOME/.local/share/godot/export_templates/4.3.stable" || true




      - name: Diagnose Android build tools
        run: |
          echo "=== HOME ==="
          echo "$HOME"
          echo "=== Godot settings ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "=== Java ==="
          ls -ld /usr/lib/jvm/java-17-openjdk-amd64 || true
          echo "=== Android SDK ==="
          ls -ld /usr/lib/android-sdk /usr/lib/android-sdk/build-tools/33.0.2 || true
          echo "=== Debug keystore ==="
          ls -l /root/debug.keystore || true
          echo "=== Export templates ==="
          ls -l "$HOME/.local/share/godot/export_templates/4.3.stable" || true

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      

      - name: Build Android APK
        run: |
          echo "=== Installed Android platforms ==="
          ls -la /usr/lib/android-sdk/platforms/ || true
          echo "=== Android SDK packages ==="
          ls -la /usr/lib/android-sdk/build-tools/ || true
          echo "=== Export preset ==="
          cat export_presets.cfg
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/FamilyQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyQuest-Android-APK
          path: build/FamilyQuest.apk
          if-no-files-found: error
