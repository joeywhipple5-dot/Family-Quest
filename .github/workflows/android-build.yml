
name: Family Quest Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        
      - name: Setup Godot Android environment
        run: |
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot "$HOME/.config/"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"


      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FamilyQuest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyQuest-Android-APK
          path: build/FamilyQuest.apk
          if-no-files-found: error
